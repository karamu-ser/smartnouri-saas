# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/m;

server {
    listen 80;
    server_name smartnouri.cloud www.smartnouri.cloud;
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name smartnouri.cloud www.smartnouri.cloud;

    # SSL Config (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/smartnouri.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartnouri.cloud/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Security Headers (Nginx level)
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # (CSP is handled by HTML and FastAPI/Express to be more specific, but can be added here too)

    # Disable showing Nginx version
    server_tokens off;

    # Frontend (React/Vite static build)
    location / {
        root /var/www/smartnouri;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend Python (FastAPI)
    location /api/v1/ {
        # Rate Limiting
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strict Rate Limit for Uploads
    location ~ ^/api/v1/restaurants/.*/menu/upload$ {
        limit_req zone=upload_limit burst=5 nodelay;
        
        # Max body size 5MB
        client_max_body_size 5M;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend Node (Express)
    location /api/contacts {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
